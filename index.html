<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizarra de Pedidos</title>
  <meta name="theme-color" content="#f7f7f2">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>Pizarra de Pedidos</h1>
        <p class="subtitle">Sincronizada entre tus ordenadores</p>
      </div>

      <div class="top-actions">
        <span id="syncStatus" class="sync-status sync-connecting">
          <span class="dot"></span>
          <span id="syncText">Conectando...</span>
        </span>

        <button id="newOrderBtn" class="primary-btn" type="button">+ Nuevo pedido</button>
      </div>
    </header>

    <section class="toolbar">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Buscar por nº, cliente, artículos o fecha">
      </label>

      <div class="toolbar-buttons">
        <button id="exportBtn" class="secondary-btn" type="button">Exportar copia</button>
        <label class="secondary-btn file-btn">
          Importar copia
          <input id="importInput" type="file" accept=".json,application/json">
        </label>
      </div>
    </section>

    <section class="whiteboard">
      <div class="board-heading">
        <div>Nº pedido</div>
        <div>Cliente</div>
        <div>Artículos</div>
        <div>Fecha</div>
        <div class="actions-title">Acciones</div>
      </div>

      <div id="ordersList" class="orders-list">
        <div class="empty-state">Conectando con la pizarra…</div>
      </div>
    </section>
  </main>

  <dialog id="orderDialog" class="order-dialog">
    <form id="orderForm" method="dialog">
      <div class="dialog-header">
        <h2 id="dialogTitle">Nuevo pedido</h2>
        <button id="closeDialogBtn" class="icon-btn" type="button" aria-label="Cerrar">×</button>
      </div>

      <input id="firebaseKey" type="hidden">

      <label>
        Nº pedido
        <input id="orderNumber" name="orderNumber" type="text" required autocomplete="off">
      </label>

      <label>
        Cliente
        <input id="clientName" name="clientName" type="text" required autocomplete="off">
      </label>

      <label>
        Artículos
        <textarea id="articles" name="articles" rows="5" required placeholder="Puedes escribir varias líneas"></textarea>
      </label>

      <label>
        Fecha
        <input id="orderDate" name="orderDate" type="date" required>
      </label>

      <div class="dialog-actions">
        <button id="cancelBtn" class="secondary-btn" type="button">Cancelar</button>
        <button class="primary-btn" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
