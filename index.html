<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizarra de Pedidos</title>
  <meta name="theme-color" content="#f7f7f2">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>Pizarra de Pedidos</h1>
        <p class="subtitle">Excel → pizarra → sincronizado en todos los equipos</p>
      </div>

      <div class="top-actions">
        <span id="syncStatus" class="sync-status sync-connecting">
          <span class="dot"></span>
          <span id="syncText">Conectando...</span>
        </span>

        <label class="primary-btn upload-btn">
          ↑ Subir Excel
          <input id="excelInput" type="file" accept=".xlsx,.xls,.xlsm,.xlsb">
        </label>

        <button id="newOrderBtn" class="secondary-btn" type="button">+ Pedido manual</button>
      </div>
    </header>

    <section class="toolbar">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Buscar en cualquier columna">
      </label>

      <div class="toolbar-buttons">
        <button id="exportBtn" class="secondary-btn" type="button">Exportar copia</button>
        <label class="secondary-btn file-btn">
          Importar copia
          <input id="importInput" type="file" accept=".json,application/json">
        </label>
      </div>
    </section>

    <div id="messageBar" class="message-bar" hidden></div>

    <section class="whiteboard">
      <div class="board-scroll">
        <div id="boardHeader" class="board-grid board-heading"></div>
        <div id="ordersList" class="orders-list">
          <div class="empty-state">Conectando con la pizarra…</div>
        </div>
      </div>
    </section>
  </main>

  <dialog id="orderDialog" class="order-dialog">
    <form id="orderForm" method="dialog">
      <div class="dialog-header">
        <h2 id="dialogTitle">Pedido</h2>
        <button id="closeDialogBtn" class="icon-btn" type="button" aria-label="Cerrar">×</button>
      </div>

      <input id="firebaseKey" type="hidden">

      <div id="formFields" class="form-fields"></div>

      <div class="dialog-actions">
        <button id="cancelBtn" class="secondary-btn" type="button">Cancelar</button>
        <button class="primary-btn" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>

  <!-- Lector de Excel. No necesita cuenta ni instalación. -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
