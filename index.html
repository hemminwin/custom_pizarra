<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizarra de Pedidos</title>
<meta name="theme-color" content="#f7f7f2">

<style>
:root{
  --ink:#454c55;--muted:#747a80;--line:#d5d8dc;
  --blue:#0096d6;--blue2:#007fb6;--green:#15965a;--red:#d94545;
  --seri:#e1f1f8;--transfer:#f8efcf;--tampo:#f6e2e6;--greenbox:#e2f0e5;
  --embalar:#eceeef;--relieve:#ece6f3;--baby:#f7e5d9;--varios:#e2efec;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;color:var(--ink);
  font-family:"Segoe UI",Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f6f6f6
}
button,input,textarea{font:inherit}
button,label.upload{cursor:pointer}
.shell{width:min(1900px,calc(100% - 34px));margin:0 auto 40px}
.top,.toolbar,.top-actions,.toolbar-actions,.dialog-actions,.dialog-head{display:flex;align-items:center;gap:10px}
.top,.toolbar{justify-content:space-between}
.top{
  margin:0 -17px 16px;
  padding:22px 17px 18px;
  background:#fff;
  border-bottom:1px solid #dadde0;
}
.toolbar{margin-bottom:13px}
.brand{
  display:flex;
  align-items:center;
  gap:26px;
  min-width:0;
}
.brand-logo{
  display:block;
  width:auto;
  height:92px;
  max-width:330px;
  object-fit:contain;
}
.brand-title{
  height:92px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  color:#525962;
  font-family:"Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
  font-weight:800;
  font-size:39px;
  line-height:.88;
  letter-spacing:.035em;
  white-space:nowrap;
}
.brand-title span:last-child{
  color:#0096d6;
}
.btn,.icon-btn,.row-btn{
  border-radius:2px;border:1px solid #cfd3d7;background:#fff;color:#444c54;padding:10px 14px;transition:.15s
}
.btn:hover,.row-btn:hover{background:#f1f4f8}
.btn.primary{border:0;background:var(--blue);color:#fff;font-weight:750;box-shadow:0 7px 18px rgba(23,105,255,.18)}
.btn.primary:hover{background:var(--blue2)}
.upload{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.upload input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sync{
  display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:2px;
  background:#fff;border:1px solid var(--line);white-space:nowrap
}
.dot{width:10px;height:10px;border-radius:50%;background:#c0c5ce}
.sync.online .dot{background:var(--green)}
.sync.offline .dot{background:var(--red)}
.sync.connecting .dot{background:#e5a71b;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.search{
  flex:1;max-width:760px;display:flex;align-items:center;gap:9px;padding:0 13px;background:#fff;
  border:1px solid #cfd3d7;border-radius:2px
}
.search input{width:100%;border:0;outline:0;background:transparent;padding:12px 0}
.message{margin:0 0 12px;padding:11px 13px;border:1px solid #bcd5ff;border-radius:10px;background:#edf5ff;color:#174d94}
.message.error{border-color:#efbaba;background:#fff0f0;color:#922b2b}
.board{
  overflow:hidden;border:1px solid #cfd3d7;border-radius:0;background:#fff;
  box-shadow:0 8px 24px rgba(55,65,75,.08)
}
.scroll{overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 215px);min-height:280px}
.grid{
  display:grid;
  grid-template-columns:
    minmax(90px,.72fr)
    minmax(140px,1.25fr)
    repeat(8,minmax(105px,.82fr))
    minmax(110px,.85fr)
    minmax(86px,.62fr);
  width:100%;
  min-width:0
}
.heading{
  position:sticky;top:0;z-index:30;background:#f0f1f2;border-bottom:2px solid #8c939a;
  font-family:"Segoe Print","Comic Sans MS",cursive;
  font-weight:800;
  text-transform:none;
  letter-spacing:0
}
.sort-header{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
}
.sort-btn{
  flex:0 0 auto;width:28px;height:28px;padding:0;border:1px solid #cbd2da;border-radius:7px;
  background:rgba(255,255,255,.78);color:#536070;font-size:14px;line-height:1;cursor:pointer;
}
.sort-btn:hover{background:#fff;color:#172033;border-color:#aeb7c2}
.sort-btn.active{background:#fff;color:#0096d6;border-color:#8ccfe9;box-shadow:0 0 0 2px rgba(0,150,214,.08)}
.heading>div,.row>div{min-width:0;padding:12px 13px;border-right:1px solid #d9dee4}
.heading>div:last-child,.row>div:last-child{border-right:0}
.row{border-bottom:1px solid #dfe3e8;background:rgba(255,255,255,.97);align-items:stretch}
.row>div{display:flex;align-items:center;min-height:76px;white-space:pre-wrap;overflow-wrap:anywhere}
.h-order,.c-order{position:sticky;left:0;z-index:15;background:#fff}
.h-client,.c-client{position:relative;z-index:14;background:#fff}
.h-order,.h-client{z-index:40}
.c-order{font-family:"Segoe Print","Comic Sans MS",cursive;font-weight:800}
.c-client{font-weight:650}
.seri{background:var(--seri)}.transfer{background:var(--transfer)}.tampo{background:var(--tampo)}
.greenbox{background:var(--greenbox)}.embalar{background:var(--embalar)}.relieve{background:var(--relieve)}
.baby{background:var(--baby)}.varios{background:var(--varios)}
.actions{justify-content:center;gap:6px;background:#f6f6f6}
.row-btn{padding:7px 9px}.row-btn.del:hover{color:#992929;background:#fff0f0;border-color:#efbaba}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
dialog{width:min(860px,calc(100% - 24px));max-height:calc(100vh - 28px);padding:0;border:0;border-radius:16px;box-shadow:0 30px 85px rgba(0,0,0,.26)}
dialog::backdrop{background:rgba(20,28,40,.43);backdrop-filter:blur(3px)}
dialog form{padding:22px;max-height:calc(100vh - 28px);overflow:auto}
.dialog-head{justify-content:space-between;margin-bottom:17px}.dialog-head h2{margin:0}
.icon-btn{width:38px;height:38px;padding:0;font-size:1.5rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:6px;padding:10px;border-radius:11px}
.field.wide{grid-column:1/-1}.field label{font-weight:700}
.field input,.field textarea{width:100%;padding:10px 11px;border:1px solid #cfd5dd;border-radius:9px;background:rgba(255,255,255,.86);outline:0}
.field textarea{min-height:78px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,255,.09)}
.dialog-actions{justify-content:flex-end;margin-top:18px}
/* ===== RESPONSIVE ===== */

/* Portátiles y tablets horizontales: compactamos sin scroll horizontal */
@media(max-width:1250px){
  .shell{width:calc(100% - 18px);margin:12px auto 28px}
  .grid{
    grid-template-columns:
      minmax(72px,.62fr)
      minmax(105px,1fr)
      repeat(8,minmax(76px,.72fr))
      minmax(90px,.78fr)
      minmax(70px,.58fr)
  }
  .heading>div,.row>div{
    padding:9px 8px;
    font-size:.82rem;
  }
  .row>div{min-height:64px}
  .row-btn{padding:6px 6px;font-size:.78rem}
  .sort-btn{width:24px;height:24px}
  .c-order{font-size:.9rem!important}
}

/* Tablets: seguimos mostrando tabla, pero aún más compacta */
@media(max-width:980px){
  .top,.toolbar{align-items:stretch;flex-direction:column}
  .brand{justify-content:center}
  .top{gap:18px}
  .top-actions,.toolbar-actions{flex-wrap:wrap}
  .search{max-width:none}
  .grid{
    grid-template-columns:
      minmax(68px,.65fr)
      minmax(95px,1fr)
      repeat(8,minmax(68px,.76fr))
      minmax(82px,.8fr)
      minmax(64px,.62fr)
  }
  .heading>div,.row>div{
    padding:8px 6px;
    font-size:.74rem;
  }
  .row>div{line-height:1.25}
  .actions{flex-direction:column;gap:4px}
  .row-btn{width:100%;padding:5px 4px}
  .fields{grid-template-columns:1fr}
  .field.wide{grid-column:auto}
  .scroll{max-height:none}
}

/* Móvil: cada pedido pasa a tarjeta; desaparece el scroll horizontal */
@media(max-width:760px){
  body{background:#f1f3f6}
  .shell{width:calc(100% - 12px);margin:8px auto 24px}
  .brand{
    gap:12px;
    justify-content:center;
  }
  .brand-logo{
    height:58px;
    max-width:205px;
  }
  .brand-title{
    height:58px;
    font-size:24px;
  }

  .top-actions,.toolbar-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    width:100%;
  }
  .sync{grid-column:1/-1;justify-content:center}
  .btn,.upload{width:100%}

  .board{
    border-width:5px;
    border-radius:13px;
    background:transparent;
  }

  .scroll{
    overflow:visible;
    max-height:none;
  }

  .heading{
    display:none;
  }

  #rows{
    display:grid;
    gap:10px;
    padding:8px;
    background:#eef1f4;
  }

  .grid.row{
    display:grid;
    grid-template-columns:1fr;
    width:100%;
    min-width:0;
    border:1px solid #cfd5dd;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(23,32,51,.06);
  }

  .row>div{
    position:static!important;
    display:grid;
    grid-template-columns:minmax(105px,34%) 1fr;
    gap:10px;
    min-height:0;
    padding:8px 10px;
    font-size:.88rem!important;
    border-right:0;
    border-bottom:1px solid rgba(90,100,115,.13);
    background:inherit;
    align-items:start;
  }

  .row>div::before{
    content:attr(data-label);
    display:block;
    font-weight:800;
    color:#495465;
    font-size:.76rem;
    line-height:1.25;
  }

  .row>div:empty::after{
    content:"—";
    color:#9aa1aa;
  }

  .c-order,.c-client{
    position:static!important;
  }

  .c-order{
    background:#fff!important;
    font-family:"Segoe Print","Comic Sans MS",cursive;
  }

  .c-client{
    background:#fff!important;
  }

  .actions{
    display:flex!important;
    flex-direction:row!important;
    justify-content:flex-end;
    gap:8px;
    background:#f6f6f6!important;
    border-bottom:0!important;
  }

  .actions::before{
    margin-right:auto;
  }

  .row-btn{
    width:auto;
    padding:7px 10px;
    font-size:.82rem;
  }

  .message{font-size:.9rem}
}

/* Móviles pequeños */
@media(max-width:460px){
  .brand{
    gap:8px;
  }
  .brand-logo{
    height:46px;
    max-width:165px;
  }
  .brand-title{
    height:46px;
    font-size:19px;
  }
  .top-actions,.toolbar-actions{
    grid-template-columns:1fr;
  }
  .sync{grid-column:auto}
  .row>div{
    grid-template-columns:95px 1fr;
    gap:8px;
    padding:7px 8px;
    font-size:.84rem!important;
  }
  .row>div::before{font-size:.72rem}
}
</style>
</head>

<script>
/* ===== CONFIGURACIÓN FIREBASE ===== */
const firebaseConfig = {
  apiKey: "AIzaSyC86rm0aOvsh7Hj7HW8qTgnLugzoU44Qb4",
  authDomain: "custompizarra.firebaseapp.com",
  databaseURL: "https://custompizarra-default-rtdb.firebaseio.com",
  projectId: "custompizarra",
  storageBucket: "custompizarra.firebasestorage.app",
  messagingSenderId: "372101362076",
  appId: "1:372101362076:web:dca8b28cb5232ec0bd5859"
};

/* ===== COLUMNAS DEL EXCEL ===== */
const COLS = [
  {key:"numeroPedido",label:"SER. - NÚM.",type:"plain",cls:"",aliases:["SER NUM","SER NÚM","SER - NUM","SER - NÚM"]},
  {key:"cliente",label:"CLIENTE",type:"plain",cls:"",aliases:["CLIENTE"]},
  {key:"serigrafia",label:"SERIGRAFÍA",type:"tech",cls:"seri",aliases:["SERIGRAFIA","SERIGRAFÍA"]},
  {key:"transfer",label:"TRANSFER",type:"tech",cls:"transfer",aliases:["TRANSFER"]},
  {key:"tampo",label:"TAMPO",type:"tech",cls:"tampo",aliases:["TAMPO"]},
  {key:"greenbox",label:"GREENBOX",type:"tech",cls:"greenbox",aliases:["GREENBOX"]},
  {key:"embalar",label:"EMBALAR",type:"tech",cls:"embalar",aliases:["EMBALAR"]},
  {key:"transferRelieve",label:"TRANSFER RELIEVE",type:"tech",cls:"relieve",aliases:["TRANSFER RELIEVE","TRANSFER RELIEVVE"]},
  {key:"baby",label:"BABY",type:"tech",cls:"baby",aliases:["BABY"]},
  {key:"varios",label:"VARIOS",type:"tech",cls:"varios",aliases:["VARIOS"]},
  {key:"fechaSalida",label:"FECHA SALIDA",type:"plain",cls:"",aliases:["FECHA SALIDA","FECHA DE SALIDA"]}
];

const $ = id => document.getElementById(id);
const sync = $("sync"), syncText=$("syncText"), header=$("header"), rows=$("rows"),
      search=$("search"), excelInput=$("excelInput"), message=$("message"),
      editor=$("editor"), fields=$("fields"), editKey=$("editKey"), dialogTitle=$("dialogTitle");

let db=null, orders=[];
let dateSort=null; // null = orden del Excel, "asc" = antigua→reciente, "desc" = reciente→antigua

function esc(v=""){
  return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function norm(v){
  return String(v??"").trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").replace(/\s+/g," ").trim();
}
function setStatus(kind,text){sync.className="sync "+kind;syncText.textContent=text}
function show(text,error=false){
  message.textContent=text;message.className="message"+(error?" error":"");message.hidden=false;
  clearTimeout(show.t);show.t=setTimeout(()=>message.hidden=true,error?10000:7000);
}
function compatible(o={}){
  const x={...o};
  if(!x.numeroPedido && x["SER. - NÚM."])x.numeroPedido=x["SER. - NÚM."];
  if(!x.fechaSalida && x.fecha)x.fechaSalida=x.fecha;
  if(!x.varios){
    if(x.articulos)x.varios=x.articulos;
    else if(Array.isArray(x.items))x.varios=x.items.map(i=>String(i?.descripcion||"")).filter(Boolean).join("\n");
  }
  return x;
}

function parseSortableDate(value){
  const text=String(value??"").trim();
  if(!text)return null;

  // dd/mm/aaaa, dd-mm-aaaa o dd.mm.aaaa
  let m=text.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m){
    const d=Number(m[1]),mo=Number(m[2])-1,y=Number(m[3]);
    const date=new Date(y,mo,d);
    if(date.getFullYear()===y&&date.getMonth()===mo&&date.getDate()===d)return date.getTime();
  }

  // aaaa-mm-dd
  m=text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m){
    const y=Number(m[1]),mo=Number(m[2])-1,d=Number(m[3]);
    const date=new Date(y,mo,d);
    if(date.getFullYear()===y&&date.getMonth()===mo&&date.getDate()===d)return date.getTime();
  }

  // Último intento para otros formatos reconocibles por el navegador.
  const parsed=Date.parse(text);
  return Number.isNaN(parsed)?null:parsed;
}

function renderHeader(){
  header.innerHTML=COLS.map((c,i)=>{
    const cls=[c.cls,i===0?"h-order":"",i===1?"h-client":"",c.key==="fechaSalida"?"sort-header":""].filter(Boolean).join(" ");

    if(c.key==="fechaSalida"){
      const arrow=dateSort==="asc"?"▲":dateSort==="desc"?"▼":"↕";
      const title=dateSort==="asc"
        ?"Ordenado: fecha más antigua primero"
        :dateSort==="desc"
          ?"Ordenado: fecha más reciente primero"
          :"Ordenar por fecha";

      return `<div class="${cls}">
        <span>${esc(c.label)}</span>
        <button id="dateSortBtn" class="sort-btn ${dateSort?"active":""}" type="button" title="${title}" aria-label="${title}">${arrow}</button>
      </div>`;
    }

    return `<div class="${cls}">${esc(c.label)}</div>`;
  }).join("")+"<div>ACCIONES</div>";

  const sortBtn=document.getElementById("dateSortBtn");
  if(sortBtn){
    sortBtn.addEventListener("click",()=>{
      dateSort=dateSort==="asc"?"desc":"asc";
      renderHeader();
      render();
    });
  }
}
function render(){
  const q=search.value.trim().toLowerCase();
  let list=orders.filter(raw=>{
    const o=compatible(raw);
    return COLS.map(c=>o[c.key]??"").join(" ").toLowerCase().includes(q);
  });

  list.sort((a,b)=>{
    if(dateSort){
      const aDate=parseSortableDate(compatible(a).fechaSalida);
      const bDate=parseSortableDate(compatible(b).fechaSalida);

      // Fechas vacías/no reconocibles siempre al final.
      if(aDate===null&&bDate!==null)return 1;
      if(aDate!==null&&bDate===null)return -1;

      if(aDate!==null&&bDate!==null&&aDate!==bDate){
        return dateSort==="asc"?aDate-bDate:bDate-aDate;
      }
    }

    // Si no se ordena por fecha (o empatan), mantenemos el orden natural del Excel.
    const ao=Number(a.ordenExcel??999999),bo=Number(b.ordenExcel??999999);
    if(ao!==bo)return ao-bo;
    return Number(b.createdAt||b.updatedAt||0)-Number(a.createdAt||a.updatedAt||0);
  });

  if(!list.length){
    rows.innerHTML=`<div class="empty">${q?"No hay coincidencias.":"No hay pedidos. Pulsa «Subir Excel»."}</div>`;return;
  }

  rows.innerHTML=list.map(raw=>{
    const o=compatible(raw);
    const cells=COLS.map((c,i)=>{
      const cls=[c.cls,c.type==="plain"?"plain":"",i===0?"c-order":"",i===1?"c-client":""].filter(Boolean).join(" ");
      return `<div class="${cls}" data-label="${esc(c.label)}">${esc(o[c.key]??"")}</div>`;
    }).join("");
    return `<article class="grid row" data-key="${esc(raw.key)}">${cells}<div class="actions" data-label="ACCIONES">
      <button class="row-btn" type="button" data-act="edit">Editar</button>
      <button class="row-btn del" type="button" data-act="del">×</button>
    </div></article>`;
  }).join("");
}
function makeField(c,v=""){
  const wrap=document.createElement("div");
  wrap.className=["field",c.type==="tech"?"wide":"",c.cls].filter(Boolean).join(" ");
  const label=document.createElement("label");label.textContent=c.label;
  const input=c.type==="tech"?document.createElement("textarea"):document.createElement("input");
  if(c.type==="tech")input.rows=3; else input.type="text";
  input.dataset.field=c.key;input.value=v??"";
  if(c.key==="numeroPedido"||c.key==="cliente")input.required=true;
  wrap.append(label,input);return wrap;
}
function buildForm(o={}){
  fields.innerHTML="";COLS.forEach(c=>fields.appendChild(makeField(c,o[c.key]??"")));
}
function openNew(){editKey.value="";dialogTitle.textContent="Nuevo pedido";buildForm({});editor.showModal()}
function openEdit(raw){const o=compatible(raw);editKey.value=raw.key;dialogTitle.textContent="Editar "+(o.numeroPedido||"pedido");buildForm(o);editor.showModal()}
function collect(){
  const o={};fields.querySelectorAll("[data-field]").forEach(el=>o[el.dataset.field]=el.value.trim());return o;
}

function findHeaderRow(matrix){
  const targets=new Set(["SER NUM","CLIENTE"]);
  for(let r=0;r<Math.min(matrix.length,20);r++){
    const normalized=(matrix[r]||[]).map(norm);
    const hasNum=normalized.some(v=>["SER NUM","SER - NUM"].includes(v));
    const hasClient=normalized.includes("CLIENTE");
    if(hasNum&&hasClient)return r;
  }
  return -1;
}
function matchIndexes(headers){
  const normalized=headers.map(norm), result={};
  for(const c of COLS){
    const aliases=[c.label,...(c.aliases||[])].map(norm);
    const ix=normalized.findIndex(h=>aliases.includes(h));
    if(ix>=0)result[c.key]=ix;
  }
  return result;
}
function excelDateToText(value){
  if(value===null||value===undefined||value==="")return "";
  if(value instanceof Date && !Number.isNaN(value.getTime())){
    return new Intl.DateTimeFormat("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"}).format(value);
  }
  return String(value).trim();
}

async function readExcel(file){
  if(!window.XLSX)throw new Error("No se ha podido cargar el lector de Excel (SheetJS).");
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  if(!wb.SheetNames.length)throw new Error("El archivo no contiene hojas.");
  const ws=wb.Sheets[wb.SheetNames[0]];

  // Matriz real, no dependemos de que la fila 1 sea siempre la cabecera.
  const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
  const headerRow=findHeaderRow(matrix);
  if(headerRow<0)throw new Error('No encuentro una fila con "SER. - NÚM." y "CLIENTE".');

  const headers=matrix[headerRow].map(v=>String(v??"").trim());
  const idx=matchIndexes(headers);

  if(idx.numeroPedido===undefined||idx.cliente===undefined){
    throw new Error('No encuentro las columnas "SER. - NÚM." y "CLIENTE".');
  }

  const parsed=[];
  for(let r=headerRow+1;r<matrix.length;r++){
    const line=matrix[r]||[];
    const order={};
    for(const c of COLS){
      const i=idx[c.key];
      let v=i===undefined?"":line[i];
      if(c.key==="fechaSalida")v=excelDateToText(v);
      else v=v===null||v===undefined?"":String(v).trim();
      order[c.key]=v;
    }
    if(order.numeroPedido||order.cliente){
      order.ordenExcel=parsed.length+1;
      parsed.push(order);
    }
  }

  return {sheet:wb.SheetNames[0],headers,idx,parsed};
}

async function importExcel(file){
  try{
    show("Leyendo "+file.name+"…");
    setStatus("connecting","Leyendo Excel...");
    const result=await readExcel(file);

    const recognized=COLS.filter(c=>result.idx[c.key]!==undefined).map(c=>c.label);
    if(!result.parsed.length)throw new Error("No he encontrado filas de pedidos.");

    const ok=confirm(
      `Excel leído correctamente.\n\n`+
      `Hoja: ${result.sheet}\n`+
      `Pedidos encontrados: ${result.parsed.length}\n`+
      `Columnas reconocidas: ${recognized.length}/${COLS.length}\n\n`+
      `Al continuar, estos pedidos se AÑADIRÁN a los que ya hay en la pizarra.\n`+
      `Los pedidos existentes no se borrarán ni se sobrescribirán.\n\n`+
      `¿Importar?`
    );
    if(!ok){setStatus("online","Sincronizado");show("Importación cancelada.");return}

    // Añadimos el Excel a la pizarra actual sin borrar ni sobrescribir nada.
    const updates={};
    const baseOrder = orders.reduce((max, item) => {
      const n = Number(item.ordenExcel);
      return Number.isFinite(n) ? Math.max(max, n) : max;
    }, 0);

    result.parsed.forEach((o,i)=>{
      const key=db.ref("pedidos").push().key;
      updates[key]={
        ...o,
        ordenExcel:baseOrder+i+1,
        createdAt:firebase.database.ServerValue.TIMESTAMP,
        updatedAt:firebase.database.ServerValue.TIMESTAMP
      };
    });

    await db.ref("pedidos").update(updates);
    setStatus("online","Sincronizado");
    show(`Excel añadido: ${result.parsed.length} pedidos nuevos.`);
  }catch(e){
    console.error(e);setStatus("online","Sincronizado");
    show("No se ha podido leer el Excel: "+e.message,true);
  }finally{excelInput.value=""}
}

async function saveManual(ev){
  ev.preventDefault();
  const payload=collect();
  if(!payload.numeroPedido||!payload.cliente){alert("Nº de pedido y Cliente son obligatorios.");return}
  payload.updatedAt=firebase.database.ServerValue.TIMESTAMP;
  try{
    let key=editKey.value;
    if(key){
      const old=orders.find(o=>o.key===key);
      payload.createdAt=old?.createdAt||firebase.database.ServerValue.TIMESTAMP;
      payload.ordenExcel=old?.ordenExcel??999999;
    }else{
      key=db.ref("pedidos").push().key;
      payload.createdAt=firebase.database.ServerValue.TIMESTAMP;
      payload.ordenExcel=999999;
    }
    await db.ref("pedidos/"+key).set(payload);
    editor.close();
  }catch(e){console.error(e);alert("No se ha podido guardar. Revisa las reglas de Firebase.")}
}
async function del(key){
  const raw=orders.find(o=>o.key===key),o=compatible(raw||{});
  if(!confirm(`¿Eliminar el pedido ${o.numeroPedido||""}?`))return;
  try{await db.ref("pedidos/"+key).remove()}catch(e){alert("No se ha podido eliminar.")}
}
function exportJson(){
  const data={version:4,exportedAt:new Date().toISOString(),pedidos:orders.map(({key,...o})=>o)};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`pizarra-pedidos-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);
}
async function importJson(file){
  try{
    const p=JSON.parse(await file.text()),arr=Array.isArray(p)?p:p.pedidos;
    if(!Array.isArray(arr))throw new Error();
    if(!confirm(`Se importarán ${arr.length} registros. ¿Continuar?`))return;
    const fresh={};
    arr.forEach((raw,i)=>{
      const key=db.ref("pedidos").push().key,o=compatible(raw);
      const clean={};COLS.forEach(c=>clean[c.key]=String(o[c.key]??""));
      fresh[key]={...clean,ordenExcel:Number(raw.ordenExcel??i+1),createdAt:firebase.database.ServerValue.TIMESTAMP,updatedAt:firebase.database.ServerValue.TIMESTAMP};
    });
    await db.ref("pedidos").set(fresh);show(`Copia importada: ${arr.length} registros.`);
  }catch(e){show("La copia JSON no es válida.",true)}
  finally{$("jsonInput").value=""}
}

function boot(){
  renderHeader();
  try{
    if(typeof firebase==="undefined")throw new Error("No se ha cargado Firebase.");
    firebase.initializeApp(firebaseConfig);db=firebase.database();

    db.ref(".info/connected").on("value",s=>setStatus(s.val()===true?"online":"connecting",s.val()===true?"Sincronizado":"Conectando..."));

    db.ref("pedidos").on("value",s=>{
      const raw=s.val()||{};
      orders=Object.entries(raw).map(([key,value])=>({key,...(value||{})}));
      render();
    },e=>{
      console.error(e);setStatus("offline","Sin acceso a Firebase");
      rows.innerHTML='<div class="empty">Firebase está conectado, pero las reglas no permiten leer los pedidos.</div>';
    });
  }catch(e){
    console.error(e);setStatus("offline","Error de configuración");show(e.message,true);
  }
}

search.addEventListener("input",render);
excelInput.addEventListener("change",()=>{const f=excelInput.files?.[0];if(f)importExcel(f)});
$("manualBtn").addEventListener("click",openNew);
$("closeBtn").addEventListener("click",()=>editor.close());
$("cancelBtn").addEventListener("click",()=>editor.close());
$("orderForm").addEventListener("submit",saveManual);
$("exportBtn").addEventListener("click",exportJson);
$("jsonInput").addEventListener("change",()=>{const f=$("jsonInput").files?.[0];if(f)importJson(f)});
rows.addEventListener("click",ev=>{
  const b=ev.target.closest("button[data-act]");if(!b)return;
  const row=b.closest(".row"),key=row?.dataset.key;if(!key)return;
  if(b.dataset.act==="edit"){const raw=orders.find(o=>o.key===key);if(raw)openEdit(raw)}
  if(b.dataset.act==="del")del(key);
});

boot();
</script>
